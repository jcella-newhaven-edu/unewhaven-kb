services:
  nextjs:
    container_name: unewhaven-kb
    image: unewhaven-kb:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    ports:
      - "3080:3000"

    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"

    env_file:
      - .env

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    volumes:
      - nextjs-cache:/app/.next/cache

volumes:
  nextjs-cache: