services:
  unewhaven-kb-db:
    image: postgres:19-bookworm@sha256:4c736732289da844c2ab892451adc1a6e376e7d0ac54ca9571a2e1cfd14176a1
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB for this stack}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER for this stack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for this stack}
    volumes:
      - postgres-19-data:/var/lib/postgresql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - type: bind
        source: ${POSTGRES_SEED_FILE:-./db/dev-seed.sql}
        target: /docker-entrypoint-initdb.d/02-content.sql
        read_only: true
        bind:
          create_host_path: false
    networks:
      proxy:
        aliases:
          - ${COMPOSE_PROJECT_NAME}-db
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -w -c 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 30

  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
      target: compose
    restart: unless-stopped
    depends_on:
      unewhaven-kb-db:
        condition: service_healthy

    ports:
      - "${APP_PORT:-3080}:3000"

    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for this stack}
    networks:
      proxy:
        aliases:
          - ${COMPOSE_PROJECT_NAME}-app

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/search?q=password').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres-19-data:

networks:
  proxy:
    name: proxy
    external: true
