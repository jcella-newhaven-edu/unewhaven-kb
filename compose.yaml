services:
  unewhaven-kb-db:
    build:
      context: .
      dockerfile: db/Dockerfile
      args:
        POSTGRES_SEED_FILE: ${POSTGRES_SEED_FILE:-./db/dev-seed.sql}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB for this stack}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER for this stack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for this stack}
    volumes:
      - postgres-19-data:/var/lib/postgresql
    networks:
      proxy:
        aliases:
          - ${COMPOSE_PROJECT_NAME}-db
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -w -c 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 30

  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
      target: compose
    restart: unless-stopped
    depends_on:
      unewhaven-kb-db:
        condition: service_healthy

    ports:
      - "${APP_PORT:-3080}:3000"

    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for this stack}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
    networks:
      proxy:
        aliases:
          - ${COMPOSE_PROJECT_NAME}-app

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/search?q=password').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres-19-data:

networks:
  proxy:
    name: proxy
    external: true
