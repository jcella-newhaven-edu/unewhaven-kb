services:
  unewhaven-kb-db:
    image: postgres:17-bookworm@sha256:837bed18782820fe967067cb5328b02b0d9992c1be9a37ee0c9c492cfc03af3b
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/dev-seed.sql:/docker-entrypoint-initdb.d/02-dev-seed.sql:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -w -c 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 30

  nextjs:
    container_name: unewhaven-kb
    image: unewhaven-kb:compose
    build:
      context: .
      dockerfile: Dockerfile
      target: compose
    restart: unless-stopped
    depends_on:
      unewhaven-kb-db:
        condition: service_healthy
    networks:
      - proxy

    ports:
      - "3080:3000"

    environment:    
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@unewhaven-kb-db:5432/{POSTGRES_DB}

    env_file:
      - path: .env
        required: false

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/search?q=password').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres-data:

networks:
  proxy:
    external: true