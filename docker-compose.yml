# Works with both:
#   docker compose up -d --build
#   docker stack deploy -c docker-compose.yml kb   (build the image first; Swarm ignores "build")
# Also usable as a Portainer stack.

services:
  kb:
    image: ${KB_IMAGE:-knowledge-base:latest}
    build: .
    ports:
      - "${KB_PORT:-3000}:3000"
    environment:
      SITE_NAME: ${SITE_NAME:-Knowledge Base}
      SITE_TAGLINE: ${SITE_TAGLINE:-Find an answer}
      SITE_DESCRIPTION: ${SITE_DESCRIPTION:-Guides, how-tos and reference articles.}
      BASE_URL: ${BASE_URL:-}
      EDIT_URL: ${EDIT_URL:-}
      SITE_BANNER: ${SITE_BANNER:-}
      SITE_BANNER_TYPE: ${SITE_BANNER_TYPE:-note}
    # Content is baked into the image by default. To edit articles without rebuilding,
    # mount a folder over it (single host only; for Swarm use shared storage such as NFS):
    # volumes:
    #   - ./content:/app/content:ro
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache             # Next.js writes its runtime cache here
    restart: unless-stopped          # used by Compose; Swarm uses deploy.restart_policy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:                          # used by Swarm
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        delay: 5s
      rollback_config:
        order: start-first
      restart_policy:
        condition: on-failure
        max_attempts: 5
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
        reservations:
          memory: 96M
